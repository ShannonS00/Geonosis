[project]
name = "geonosis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anisocado>=0.6.0",
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
    "scopesim>=0.12.0",
    "scopesim-templates>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geonosis"]
